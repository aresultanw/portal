<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anweshika Scholarship - Merit Certificate</title>
  <script src="js/cScript-2026.js"></script>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      color: #0c245d;
      background: #edf0f4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #edf0f4;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .btn {
      border: 0;
      border-radius: 6px;
      padding: 11px 20px;
      font: 600 14px Arial, Helvetica, sans-serif;
      text-decoration: none;
      cursor: pointer;
    }

    .btn-back {
      color: #102a64;
      background: #fff;
      box-shadow: 0 1px 4px #17294b22;
    }

    .btn-print {
      color: #fff;
      background: #102a64;
    }

    .certificate {
      position: relative;
      isolation: isolate;
      container-type: inline-size;
      width: min(1120px, 100%);
      aspect-ratio: 10 / 7;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 12px 32px #17294b33;
    }

    .certificate-art {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
    }

    .student-details {
      position: absolute;
      z-index: 1;
      top: 51.5%;
      left: 7.8%;
      width: 84.4%;
      height: 40.2%;
      padding: 1.6% 2.2% 1.2%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #fff;
      clip-path: polygon(0 0, 100% 0, 100% 67%, 68% 67%, 68% 100%, 0 100%);
    }

    .details-grid {
      display: grid;
      gap: 1.25cqw;
      font-size: clamp(11px, 1.85cqw, 22px);
      line-height: 1.3;
    }

    .detail-row {
      display: grid;
      grid-template-columns: 25% 2.5% minmax(0, 1fr);
      align-items: baseline;
    }

    .detail-label {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 700;
      white-space: nowrap;
    }

    .detail-value {
      min-width: 0;
      color: #07551d;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .detail-row--dual {
      grid-template-columns: 1fr 1.08fr;
      gap: 3%;
    }

    .detail-pair {
      display: grid;
      grid-template-columns: 27% 5% minmax(0, 1fr);
      align-items: baseline;
    }

    .certificate-footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      min-height: 22%;
      padding: 0 2.8% 0.4%;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(11px, 1.8cqw, 21px);
      font-weight: 700;
    }

    .date-line {
      padding-bottom: 0.4em;
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px 8px;
      }

      .certificate {
        width: 100%;
      }

      .student-details {
        padding-top: 1.2%;
      }

      .details-grid {
        gap: 0.7cqw;
        font-size: clamp(9px, 2.1cqw, 13px);
      }

      .certificate-footer {
        font-size: clamp(9px, 2cqw, 12px);
      }

      .signature {
        width: 34%;
      }
    }

    @media print {
      @page {
        size: A4 landscape;
        margin: 0;
      }

      html,
      body {
        width: 297mm;
        height: 210mm;
        margin: 0;
        padding: 0;
        background: #fff;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }

      .controls {
        display: none !important;
      }

      .certificate {
        width: 297mm;
        height: 210mm;
        max-width: none;
        aspect-ratio: auto;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <nav class="controls" aria-label="Certificate actions">
    <a class="btn btn-back" href="index.html">&larr; Back to Results</a>
    <button class="btn btn-print" type="button" onclick="window.print()">Download / Print Certificate (PDF)</button>
  </nav>

  <main class="certificate" aria-label="Anweshika merit certificate">
    <img class="certificate-art" src="images/IMG-20261110-WA0013.jpg" alt="" aria-hidden="true">
    <section class="student-details" aria-label="Student certificate details">
      <div class="details-grid">
        <div class="detail-row">
          <span class="detail-label">Name</span>
          <span aria-hidden="true">:</span>
          <span class="detail-value" id="certName">Candidate Name</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Guardian&rsquo;s Name</span>
          <span aria-hidden="true">:</span>
          <span class="detail-value" id="certGuardian">---</span>
        </div>
        <div class="detail-row detail-row--dual">
          <div class="detail-pair">
            <span class="detail-label">Class</span>
            <span aria-hidden="true">:</span>
            <span class="detail-value" id="certClass">---</span>
          </div>
          <div class="detail-pair">
            <span class="detail-label">Admit No.</span>
            <span aria-hidden="true">:</span>
            <span class="detail-value" id="certRoll">---</span>
          </div>
        </div>
        <div class="detail-row">
          <span class="detail-label">Name of School</span>
          <span aria-hidden="true">:</span>
          <span class="detail-value" id="certSchool">---</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Marks Obtained</span>
          <span aria-hidden="true">:</span>
          <span class="detail-value" id="certMarksCell">--</span>
        </div>
      </div>
      <footer class="certificate-footer">
        <div class="date-line">Date : <span id="certDate">---</span></div>
      </footer>
    </section>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const params = new URLSearchParams(window.location.search);
      let sName = params.get("name");
      let sRoll = params.get("roll");
      let sClass = params.get("class");
      let sSchool = params.get("school");
      let sGuardian = params.get("guardian");
      let sMarks = params.get("marks");

      if ((!sSchool || sSchool === "---") && sRoll && typeof studentRecords !== "undefined") {
        const match = studentRecords.find(function (item) {
          const roll = String(item["RollNumber"] || item["Roll No"] || "").trim().toUpperCase();
          return roll === sRoll.trim().toUpperCase();
        });
        if (match) {
          sName = sName || match["Name"];
          sClass = match["Class"];
          sSchool = match["SCHOOLNAME"];
          sGuardian = match["GUARDIAN'SNAME"];
          sMarks = match["Marks"];
        }
      }

      if (!sName) {
        try {
          const raw = sessionStorage.getItem("currentStudentCert") || localStorage.getItem("currentStudentCert");
          if (raw) {
            const data = JSON.parse(raw);
            sName = data["Name"] || data.name;
            sRoll = data["RollNumber"] || data.roll;
            sClass = data["Class"] || data.class;
            sSchool = data["SCHOOLNAME"] || data.school;
            sGuardian = data["GUARDIAN'SNAME"] || data.guardian;
            sMarks = data["Marks"] !== undefined ? data["Marks"] : data.marks;
          }
        } catch (error) {
          console.error("Could not read the saved certificate details.", error);
        }
      }

      document.getElementById("certName").textContent = sName || "Candidate Name";
      document.getElementById("certRoll").textContent = sRoll || "---";
      document.getElementById("certClass").textContent = sClass || "---";
      document.getElementById("certSchool").textContent = sSchool || "---";
      document.getElementById("certGuardian").textContent = sGuardian || "---";
      document.getElementById("certMarksCell").textContent =
        sMarks !== null && sMarks !== undefined && sMarks !== "" ? sMarks : "--";
      document.getElementById("certDate").textContent =
        new Date().toLocaleDateString("en-GB").replaceAll("/", ".");
    });
  </script>
</body>
</html>
